<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" width="1520" height="1128" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="564" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a90"/></marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">The control plane decides; worker nodes run the pods</text>
  <rect x="200" y="56" width="536" height="184" rx="8" fill="#f2f2ef" stroke="#9a9a90" stroke-width="1.25"/>
  <text x="216" y="80" font-weight="600" fill="#1f1f1f">Control plane (master node)</text>
  <rect x="24" y="300" width="344" height="184" rx="8" fill="#f2f2ef" stroke="#9a9a90" stroke-width="1.25"/>
  <text x="40" y="324" font-weight="600" fill="#1f1f1f">Worker node 1</text>
  <rect x="392" y="300" width="344" height="184" rx="8" fill="#f2f2ef" stroke="#9a9a90" stroke-width="1.25"/>
  <text x="408" y="324" font-weight="600" fill="#1f1f1f">Worker node 2</text>
  <g fill="none" stroke="#9a9a90" stroke-width="1.25">
    <path d="M164 124H214" marker-end="url(#a)"/>
    <path d="M456 124H478" marker-end="url(#a)"/>
    <path d="M336 152V166" marker-end="url(#a)"/>
    <path d="M456 144H468V196H478" marker-end="url(#a)"/>
    <path d="M468 240V284H196V298" marker-end="url(#a)"/>
    <path d="M468 284H564V298" marker-end="url(#a)"/>
    <path d="M196 484V500"/>
    <path d="M564 484V500"/>
  </g>
  <text x="476" y="270" font-size="11.5" fill="#5f5f5f">API server to kubelet on each node</text>
  <g text-anchor="middle">
    <rect x="24" y="96" width="140" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="94" y="120" font-weight="600" fill="#1f1f1f">kubectl</text>
    <text x="94" y="136" font-size="11.5" fill="#5f5f5f">your commands</text>

    <rect x="216" y="96" width="240" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd6" stroke-width="2"/>
    <text x="336" y="120" font-weight="600" fill="#1f1f1f">API Server</text>
    <text x="336" y="136" font-size="11.5" fill="#1f1f1f">gateway for all communication</text>

    <rect x="480" y="96" width="240" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="600" y="120" font-weight="600" fill="#1f1f1f">Scheduler</text>
    <text x="600" y="136" font-size="11.5" fill="#5f5f5f">picks a node for each pod</text>

    <rect x="216" y="168" width="240" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="336" y="192" font-weight="600" fill="#1f1f1f">etcd</text>
    <text x="336" y="208" font-size="11.5" fill="#5f5f5f">key-value store of cluster state</text>

    <rect x="480" y="168" width="240" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="600" y="192" font-weight="600" fill="#1f1f1f">Controller Manager</text>
    <text x="600" y="208" font-size="11.5" fill="#5f5f5f">keeps the desired state</text>

    <rect x="40" y="340" width="152" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="116" y="364" font-weight="600" fill="#1f1f1f">kubelet</text>
    <text x="116" y="380" font-size="11.5" fill="#5f5f5f">runs + reports pods</text>
    <rect x="200" y="340" width="152" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="276" y="364" font-weight="600" fill="#1f1f1f">kube-proxy</text>
    <text x="276" y="380" font-size="11.5" fill="#5f5f5f">routes traffic</text>
    <rect x="40" y="412" width="312" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="196" y="436" font-weight="600" fill="#1f1f1f">Pods</text>
    <text x="196" y="452" font-size="11.5" fill="#5f5f5f">containers run here (containerd)</text>

    <rect x="408" y="340" width="152" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="484" y="364" font-weight="600" fill="#1f1f1f">kubelet</text>
    <text x="484" y="380" font-size="11.5" fill="#5f5f5f">runs + reports pods</text>
    <rect x="568" y="340" width="152" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="644" y="364" font-weight="600" fill="#1f1f1f">kube-proxy</text>
    <text x="644" y="380" font-size="11.5" fill="#5f5f5f">routes traffic</text>
    <rect x="408" y="412" width="312" height="56" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="564" y="436" font-weight="600" fill="#1f1f1f">Pods</text>
    <text x="564" y="452" font-size="11.5" fill="#5f5f5f">containers run here (containerd)</text>

    <rect x="24" y="500" width="712" height="40" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="380" y="525" fill="#1f1f1f">CNI network (Calico, Weave Net) links every node</text>
  </g>
</svg>
