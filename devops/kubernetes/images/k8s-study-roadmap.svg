<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="1520" height="928" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="464" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a90"/></marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Study path: master each layer before the next</text>
  <g fill="none" stroke="#9a9a90" stroke-width="1.25">
    <path d="M194 128V158" marker-end="url(#a)"/>
    <path d="M194 232V262" marker-end="url(#a)"/>
    <path d="M194 336V366" marker-end="url(#a)"/>
    <path d="M364 404H380V92H394" marker-end="url(#a)"/>
    <path d="M566 128V158" marker-end="url(#a)"/>
    <path d="M566 232V262" marker-end="url(#a)"/>
    <path d="M566 336V366" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle">
    <rect x="24" y="56" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="194" y="80" font-weight="600" fill="#1f1f1f">1 · Prerequisites (§5)</text>
    <text x="194" y="96" font-size="11.5" fill="#5f5f5f">Linux basics, Docker</text>
    <text x="194" y="112" font-size="11.5" fill="#5f5f5f">YAML: key-values, lists, objects</text>

    <rect x="24" y="160" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="194" y="184" font-weight="600" fill="#1f1f1f">2 · Core concepts (§2–6)</text>
    <text x="194" y="200" font-size="11.5" fill="#5f5f5f">Monolith vs microservices, architecture, setup</text>
    <text x="194" y="216" font-size="11.5" fill="#5f5f5f">kubectl, pods, namespaces, labels, selectors</text>

    <rect x="24" y="264" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="194" y="288" font-weight="600" fill="#1f1f1f">3 · Workloads (§7)</text>
    <text x="194" y="304" font-size="11.5" fill="#5f5f5f">Deployments, ReplicaSets, StatefulSets</text>
    <text x="194" y="320" font-size="11.5" fill="#5f5f5f">DaemonSets, Jobs, CronJobs, rolling updates</text>

    <rect x="24" y="368" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="194" y="392" font-weight="600" fill="#1f1f1f">4 · Networking (§9)</text>
    <text x="194" y="408" font-size="11.5" fill="#5f5f5f">Services: ClusterIP, NodePort, LoadBalancer</text>
    <text x="194" y="424" font-size="11.5" fill="#5f5f5f">Ingress, cluster DNS, network policies</text>

    <rect x="396" y="56" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="566" y="80" font-weight="600" fill="#1f1f1f">5 · Storage and config (§8, §10)</text>
    <text x="566" y="96" font-size="11.5" fill="#5f5f5f">PersistentVolumes, PVCs, StorageClasses</text>
    <text x="566" y="112" font-size="11.5" fill="#5f5f5f">ConfigMaps, Secrets</text>

    <rect x="396" y="160" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="566" y="184" font-weight="600" fill="#1f1f1f">6 · Scaling and scheduling (§11)</text>
    <text x="566" y="200" font-size="11.5" fill="#5f5f5f">HPA, VPA, resource quotas and limits, probes</text>
    <text x="566" y="216" font-size="11.5" fill="#5f5f5f">Taints and tolerations, node affinity</text>

    <rect x="396" y="264" width="340" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
    <text x="566" y="288" font-weight="600" fill="#1f1f1f">7 · Admin and advanced (§12–15)</text>
    <text x="566" y="304" font-size="11.5" fill="#5f5f5f">RBAC, dashboard, CRDs, operators, Helm</text>
    <text x="566" y="320" font-size="11.5" fill="#5f5f5f">Init and sidecar containers, Istio service mesh</text>

    <rect x="396" y="368" width="340" height="72" rx="8" fill="#e6eefb" stroke="#2f6fd6" stroke-width="2"/>
    <text x="566" y="392" font-weight="600" fill="#1f1f1f">8 · Projects (§16)</text>
    <text x="566" y="408" font-size="11.5" fill="#1f1f1f">Chat app on minikube, monitoring with</text>
    <text x="566" y="424" font-size="11.5" fill="#1f1f1f">Prometheus + Grafana, EKS mega project</text>
  </g>
</svg>
